[package]
name = "commit-hooks"
version = "0.1.0"
edition = "2024"
description = "Out-of-the-box hooks for pre-commit, re-implemented as a single static Rust binary"
license = "MIT"
repository = "https://github.com/zydou/commit-hooks"
keywords = ["pre-commit", "git", "lint", "hooks"]
categories = ["command-line-utilities", "development-tools"]

# The binary keeps a stable name so it drops straight into a
# `.pre-commit-config.yaml` `entry:` and replaces the upstream Python
# `pre-commit-hooks` package.
[[bin]]
name = "commit-hooks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
quick-xml = "0.42"
ruff_python_ast = "0.0.20"
ruff_python_parser = "0.0.20"
ruff_text_size = "0.0.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
